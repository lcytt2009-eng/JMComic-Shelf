name: ios-unsigned

# 在 GitHub 的 macOS 服务器上把 Tauri 应用编译成「未签名 ipa」，
# 下载到 Windows 后用 Sideloadly 用自己的 Apple ID 签名安装。
#
# 关键点（都是踩过的坑）：
#   1. 必须用 `tauri ios build`，不能直接调 xcodebuild ——
#      工程的 Build Rust Code 脚本阶段要连回 CLI 进程（读 TMPDIR 里的 options addr 文件），
#      没有 CLI 父进程就直接 panic: "failed to read missing addr file"
#   2. `--no-sign` 跳过签名，CLI 内部会用 create_ipa() 打一个未签名 ipa，正好给 Sideloadly 用
#   3. 前端必须是移动外壳：步骤级 env JM_SHELL=mobile，beforeBuildCommand 的 `pnpm build` 才能拿到
#   4. pnpm 版本由 package.json 的 packageManager 决定，不能再写 with.version

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-*"

jobs:
  build-ios:
    # 用 Intel 池子（macos-14 = x86_64）：arm64 池（macos-latest / *-arm64）经常排 15 分钟抢不到机器。
    # iOS 是交叉编译到 aarch64-apple-ios，Intel 机器编出来的包在 iPhone 上一样跑。
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # macos-14 默认的 Xcode 是 15.4，读不了 tauri 生成的新工程格式（objectVersion 77），
      # 报 "future Xcode project file format"。镜像里还装了 16.2，切过去即可。
      - name: Select Xcode 16
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          if [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode_1[6-9]*.app /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -n 1)"
          fi
          xcodebuild -version

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (with iOS target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-aarch64
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 仓库锁定的 @tauri-apps/cli 版本太老，没有 `ios build --no-sign`（该参数 2.12.x 才有）。
      # 只在 CI 里升，不改用户的 package.json。
      - name: Upgrade Tauri CLI (needs --no-sign)
        run: |
          set -euo pipefail
          pnpm add -D @tauri-apps/cli@2.12.4
          pnpm tauri --version
          pnpm tauri ios build --help

      # 仓库 icons/ 里没有 iOS 的 AppIcon，用 docs/图标.png 现场生成一套。
      # 失败不阻塞：真缺图标时再看这一步日志。
      - name: (optional) regenerate icons incl. iOS
        continue-on-error: true
        run: |
          if [ -f "docs/图标.png" ]; then
            cp "docs/图标.png" /tmp/appicon.png
            pnpm tauri icon /tmp/appicon.png
            ls -la src-tauri/icons/ios 2>/dev/null || true
          else
            echo "docs/图标.png 不存在，跳过"
          fi

      - name: Init iOS project
        env:
          CI: "true"
        run: |
          set -euo pipefail
          pnpm tauri ios init
          ls -la src-tauri/gen/apple

      # ATS：禁漫的域名/图床会换、部分走 HTTP，iOS 默认掐断
      # 文件共享：让沙盒目录在「文件」App 里可见
      - name: Patch Info.plist (ATS / Files / 竖屏)
        run: |
          set -euo pipefail
          PLIST=$(find src-tauri/gen/apple -name Info.plist -not -path '*/Pods/*' -not -path '*/build/*' | head -n 1)
          if [ -z "$PLIST" ]; then
            echo "找不到 Info.plist"; find src-tauri/gen/apple -maxdepth 3; exit 1
          fi
          echo "patch: $PLIST"

          pb() { /usr/libexec/PlistBuddy -c "$1" "$PLIST"; }
          del() { pb "Delete :$1" >/dev/null 2>&1 || true; }

          del NSAppTransportSecurity
          pb "Add :NSAppTransportSecurity dict"
          pb "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true"
          pb "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true"
          pb "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true"

          del UIFileSharingEnabled
          pb "Add :UIFileSharingEnabled bool true"
          del LSSupportsOpeningDocumentsInPlace
          pb "Add :LSSupportsOpeningDocumentsInPlace bool true"

          del CFBundleDisplayName
          pb "Add :CFBundleDisplayName string 禁漫书架"

          del UISupportedInterfaceOrientations
          pb "Add :UISupportedInterfaceOrientations array"
          pb "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait"

          del ITSAppUsesNonExemptEncryption
          pb "Add :ITSAppUsesNonExemptEncryption bool false"

          plutil -lint "$PLIST"

      # JM_SHELL=mobile 让 vite 选中 src/mobile 外壳（详见 vite.config.ts）
      - name: Build iOS (unsigned ipa)
        env:
          CI: "true"
          JM_SHELL: mobile
        run: |
          set -euo pipefail
          pnpm tauri ios build --no-sign --ignore-version-mismatches 2>&1 | tee build.log

      - name: Collect ipa
        run: |
          set -euo pipefail
          mkdir -p out
          find src-tauri/gen/apple -name '*.ipa' -print -exec cp {} out/ \;
          ls -lh out

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: |
            out/*.ipa
            build.log
          if-no-files-found: warn
